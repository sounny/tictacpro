<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Chaos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #374151;
            background-color: #1e293b;
            transition: all 0.3s ease;
        }

        .cell:hover {
            background-color: #334155;
        }

        .cell.x {
            color: #ef4444;
        }

        .cell.o {
            color: #3b82f6;
        }

        .cell.new {
            animation: cellAppear 0.3s ease-out;
        }

        @keyframes cellAppear {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .board-transition {
            transition: all 0.5s ease;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .cell {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }

            .status {
                font-size: 1.125rem;
            }

            .mode-button,
            .reset-button {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }
        }

        @media (max-width: 400px) {
            .cell {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }

            .status {
                font-size: 1rem;
            }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #ffffff;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .modal-button {
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .chaos-indicator {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        .chaos-pulse {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-900 to-slate-700 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-800 p-6 md:p-8 rounded-xl shadow-2xl w-full max-w-md">
        <h1
            class="text-4xl md:text-5xl font-bold text-center mb-6 bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500">
            Tic Tac Chaos</h1>
        <p class="text-slate-300 text-sm sm:text-base my-4 text-center max-w-xs sm:max-w-sm mx-auto leading-relaxed">
            Experience the unpredictable! The board randomly changes size between 3x3 and 4x4 during the game. Adapt your strategy on the fly to win!
        </p>
        <div id="modeSelection" class="mb-6 text-center">
            <h2 class="text-xl mb-3 text-slate-300">Choose Game Mode:</h2>
            <div class="flex justify-center space-x-3">
                <button id="vsPlayer"
                    class="mode-button bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 ease-in-out transform hover:scale-105">2
                    Players</button>
                <button id="vsComputer"
                    class="mode-button bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 ease-in-out transform hover:scale-105">vs
                    Computer</button>
            </div>
        </div>

        <div id="gameArea" class="hidden">
            <div class="text-center mb-4">
                <span id="boardSizeIndicator" class="chaos-indicator bg-purple-600 text-white">
                    Board: 3x3
                </span>
            </div>

            <div id="gameBoard"
                class="grid gap-1.5 mx-auto bg-slate-500 rounded-lg overflow-hidden shadow-lg board-transition"
                style="width: fit-content;">
            </div>

            <p id="status" class="status text-xl text-center mt-6 mb-4 h-8 text-slate-300"></p>

            <div class="flex justify-center space-x-3 mt-4">
                <button id="resetButton"
                    class="reset-button bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-150 ease-in-out transform hover:scale-105">Reset
                    Game</button>
                <button id="changeModeButton"
                    class="reset-button bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-150 ease-in-out transform hover:scale-105">Change
                    Mode</button>
            </div>
        </div>
    </div>

    <div id="messageModal" class="modal">
        <div class="modal-content bg-slate-800 text-white p-6 rounded-lg shadow-xl max-w-sm mx-auto">
            <p id="modalMessage" class="text-lg mb-4"></p>
            <button id="modalCloseButton"
                class="modal-button bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-5 rounded-md">OK</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const gameBoardElement = document.getElementById('gameBoard');
        const statusElement = document.getElementById('status');
        const resetButton = document.getElementById('resetButton');
        const changeModeButton = document.getElementById('changeModeButton');
        const modeSelectionDiv = document.getElementById('modeSelection');
        const gameAreaDiv = document.getElementById('gameArea');
        const vsPlayerButton = document.getElementById('vsPlayer');
        const vsComputerButton = document.getElementById('vsComputer');
        const boardSizeIndicator = document.getElementById('boardSizeIndicator');

        // Modal elements
        const messageModal = document.getElementById('messageModal');
        const modalMessageElement = document.getElementById('modalMessage');
        const modalCloseButton = document.getElementById('modalCloseButton');

        // Game State Variables
        let board = [];
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = ''; // '2P' or 'PvC'
        let computerTimeout;
        let boardSize = 3; // Current board size (3 or 4)
        let moveCount = 0; // Track number of moves

        // --- Modal Functions ---
        function showModal(message) {
            modalMessageElement.textContent = message;
            messageModal.style.display = 'flex';
        }

        function closeModal() {
            messageModal.style.display = 'none';
        }

        modalCloseButton.addEventListener('click', closeModal);
        window.addEventListener('click', (event) => {
            if (event.target === messageModal) {
                closeModal();
            }
        });

        // --- Chaos Functions ---
        function shouldChangeBoardSize() {
            // Attempt to change board at multiples of 3 or 4 moves, with 50% probability
            if (moveCount < 2) return false; // Don't change too early
            if (moveCount % 3 === 0 || moveCount % 4 === 0) {
                return Math.random() < 0.5; // 50% chance on eligible moves
            }
            return false;
        }

        function changeBoardSize() {
            const newSize = boardSize === 3 ? 4 : 3;
            const oldBoard = [...board];
            const oldSize = boardSize;

            boardSize = newSize;
            const newBoard = Array(boardSize * boardSize).fill('');

            // Transfer existing marks to new board
            for (let i = 0; i < oldSize; i++) {
                for (let j = 0; j < oldSize; j++) {
                    const oldIndex = i * oldSize + j;
                    const newIndex = i * boardSize + j;
                    if (newIndex < newBoard.length) {
                        newBoard[newIndex] = oldBoard[oldIndex];
                    }
                }
            }

            board = newBoard;
            updateBoardSizeIndicator();
            renderBoard();

            // Show notification
            showModal(`CHAOS! The board just changed to ${boardSize}x${boardSize}!`);
        }

        function updateBoardSizeIndicator() {
            boardSizeIndicator.textContent = `Board: ${boardSize}x${boardSize}`;
            boardSizeIndicator.classList.add('chaos-pulse');
            setTimeout(() => {
                boardSizeIndicator.classList.remove('chaos-pulse');
            }, 500);
        }

        // --- Game Logic Functions ---

        function initializeGame() {
            boardSize = 3; // Always start with 3x3
            board = Array(boardSize * boardSize).fill('');
            moveCount = 0;
            gameActive = true;
            updateBoardSizeIndicator();
            statusElement.textContent = `${gameMode === 'PvC' && currentPlayer === 'O' ? "Computer's (O)" : `Player ${currentPlayer}'s`} turn`;
            renderBoard();
            clearTimeout(computerTimeout);

            if (gameMode === 'PvC' && currentPlayer === 'O') {
                statusElement.textContent = "Computer's (O) thinking...";
                toggleBoardInteraction(false);
                computerTimeout = setTimeout(() => {
                    computerMove();
                    toggleBoardInteraction(true);
                }, 700);
            }
        }

        function renderBoard() {
            gameBoardElement.innerHTML = '';
            gameBoardElement.className = `grid gap-1.5 mx-auto bg-slate-500 rounded-lg overflow-hidden shadow-lg board-transition`;
            gameBoardElement.classList.add(`grid-cols-${boardSize}`);
            
            board.forEach((mark, index) => {
                const cell = document.createElement('div');
                cell.classList.add('cell', 'rounded-md');
                if (mark === 'X') cell.classList.add('x');
                if (mark === 'O') cell.classList.add('o');
                cell.textContent = mark;
                cell.dataset.index = index;
                cell.setAttribute('aria-label', `Cell ${index + 1}, currently ${mark || 'empty'}`);
                cell.setAttribute('role', 'button');
                cell.setAttribute('tabindex', '0');
                cell.addEventListener('click', handleCellClick);
                cell.addEventListener('touchend', handleCellClick, { passive: false });
                gameBoardElement.appendChild(cell);
            });
        }

        function handleCellClick(event) {
            event.preventDefault();
            if (!gameActive) return;

            const clickedCell = event.currentTarget;
            const clickedCellIndex = parseInt(clickedCell.dataset.index);

            if (board[clickedCellIndex] !== '' || !gameActive) {
                return;
            }

            makeMove(clickedCellIndex, currentPlayer);

            if (!gameActive) return;

            if (gameMode === 'PvC' && currentPlayer === 'O' && gameActive) {
                statusElement.textContent = "Computer's (O) thinking...";
                toggleBoardInteraction(false);
                computerTimeout = setTimeout(() => {
                    computerMove();
                    toggleBoardInteraction(true);
                }, 700);
            }
        }

        function makeMove(index, player) {
            if (board[index] === '' && gameActive) {
                board[index] = player;
                moveCount++;
                
                const cellElement = gameBoardElement.children[index];
                cellElement.textContent = player;
                if (player === 'X') cellElement.classList.add('x');
                if (player === 'O') cellElement.classList.add('o');
                cellElement.setAttribute('aria-label', `Cell ${index + 1}, marked as ${player}`);

                if (checkWin(player)) {
                    endGame(false, player);
                } else if (board.every(cell => cell !== '')) {
                    endGame(true);
                } else {
                    // Check if board should change size
                    if (shouldChangeBoardSize()) {
                        setTimeout(() => {
                            changeBoardSize();
                            if (gameActive) {
                                switchPlayer();
                            }
                        }, 300);
                    } else {
                        switchPlayer();
                    }
                }
            }
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            if (gameActive) {
                statusElement.textContent = `${gameMode === 'PvC' && currentPlayer === 'O' ? "Computer's (O)" : `Player ${currentPlayer}'s`} turn`;
            }
        }

        function getWinningConditions() {
            const conditions = [];
            
            // Rows
            for (let i = 0; i < boardSize; i++) {
                const row = [];
                for (let j = 0; j < boardSize; j++) {
                    row.push(i * boardSize + j);
                }
                conditions.push(row);
            }
            
            // Columns
            for (let j = 0; j < boardSize; j++) {
                const col = [];
                for (let i = 0; i < boardSize; i++) {
                    col.push(i * boardSize + j);
                }
                conditions.push(col);
            }
            
            // Diagonal (top-left to bottom-right)
            const diag1 = [];
            for (let i = 0; i < boardSize; i++) {
                diag1.push(i * boardSize + i);
            }
            conditions.push(diag1);
            
            // Diagonal (top-right to bottom-left)
            const diag2 = [];
            for (let i = 0; i < boardSize; i++) {
                diag2.push(i * boardSize + (boardSize - 1 - i));
            }
            conditions.push(diag2);
            
            return conditions;
        }

        function checkWin(player) {
            const winningConditions = getWinningConditions();
            return winningConditions.some(condition => {
                return condition.every(index => board[index] === player);
            });
        }

        function computerMove() {
            if (!gameActive) return;

            let bestMove = -1;

            // 1. Check if computer can win
            for (let i = 0; i < board.length; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    if (checkWin('O')) {
                        bestMove = i;
                        board[i] = '';
                        break;
                    }
                    board[i] = '';
                }
            }

            // 2. Block player from winning
            if (bestMove === -1) {
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        if (checkWin('X')) {
                            bestMove = i;
                            board[i] = '';
                            break;
                        }
                        board[i] = '';
                    }
                }
            }

            // 3. Take center if available (works for both 3x3 and 4x4)
            if (bestMove === -1) {
                const centerPositions = boardSize === 3 ? [4] : [5, 6, 9, 10];
                const availableCenters = centerPositions.filter(pos => board[pos] === '');
                if (availableCenters.length > 0) {
                    bestMove = availableCenters[Math.floor(Math.random() * availableCenters.length)];
                }
            }

            // 4. Take a corner
            if (bestMove === -1) {
                const corners = boardSize === 3 
                    ? [0, 2, 6, 8]
                    : [0, 3, 12, 15];
                const availableCorners = corners.filter(index => board[index] === '');
                if (availableCorners.length > 0) {
                    bestMove = availableCorners[Math.floor(Math.random() * availableCorners.length)];
                }
            }

            // 5. Take any available spot
            if (bestMove === -1) {
                const availableMoves = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
                if (availableMoves.length > 0) {
                    bestMove = availableMoves[Math.floor(Math.random() * availableMoves.length)];
                }
            }

            if (bestMove !== -1) {
                makeMove(bestMove, 'O');
            } else if (board.every(cell => cell !== '')) {
                endGame(true);
            }
        }

        function endGame(isTie, winner = null) {
            gameActive = false;
            if (isTie) {
                statusElement.textContent = "It's a Tie!";
                showModal("It's a Tie! Well played by both sides.");
            } else if (winner) {
                const winnerName = (gameMode === 'PvC' && winner === 'O') ? "Computer (O)" : `Player ${winner}`;
                statusElement.textContent = `${winnerName} wins!`;
                showModal(`${winnerName} is the winner! Congratulations!`);

                const winningConditions = getWinningConditions();
                winningConditions.forEach(condition => {
                    if (condition.every(index => board[index] === winner)) {
                        condition.forEach(index => {
                            gameBoardElement.children[index].classList.add('bg-yellow-400', 'text-slate-800');
                        });
                    }
                });
            }
        }

        function toggleBoardInteraction(enable) {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                if (enable) {
                    cell.style.pointerEvents = 'auto';
                    cell.style.opacity = '1';
                } else {
                    cell.style.pointerEvents = 'none';
                    cell.style.opacity = '0.7';
                }
            });
        }

        // --- Event Listeners Setup ---
        vsPlayerButton.addEventListener('click', () => {
            gameMode = '2P';
            currentPlayer = 'X';
            modeSelectionDiv.classList.add('hidden');
            gameAreaDiv.classList.remove('hidden');
            initializeGame();
        });

        vsComputerButton.addEventListener('click', () => {
            gameMode = 'PvC';
            modeSelectionDiv.classList.add('hidden');
            gameAreaDiv.classList.remove('hidden');
            currentPlayer = Math.random() < 0.5 ? 'X' : 'O';
            initializeGame();
        });

        resetButton.addEventListener('click', () => {
            if (gameMode === 'PvC') {
                currentPlayer = Math.random() < 0.5 ? 'X' : 'O';
            } else {
                currentPlayer = 'X';
            }
            initializeGame();
        });

        changeModeButton.addEventListener('click', () => {
            gameAreaDiv.classList.add('hidden');
            modeSelectionDiv.classList.remove('hidden');
            statusElement.textContent = "";
        });

        gameBoardElement.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                const activeElement = document.activeElement;
                if (activeElement && activeElement.classList.contains('cell')) {
                    handleCellClick({ currentTarget: activeElement, preventDefault: () => { } });
                }
            }
        });

        // Initial setup
        modeSelectionDiv.classList.remove('hidden');
        gameAreaDiv.classList.add('hidden');

    </script>
    <div class="mt-6 text-center">
        <a href="index.html" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded">Return to Menu</a>
    </div>
</body>

</html>
